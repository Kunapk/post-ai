# ──────────────── goldapp.safebsc.finance ────────────────
server {
    server_name goldapp.safebsc.finance;

    root /var/www/flutter;
    index index.html;

    # ✅ Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ✅ Flutter routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/goldapp.safebsc.finance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldapp.safebsc.finance/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS for goldapp
server {
    listen 80;
    server_name goldapp.safebsc.finance;
    return 301 https://$host$request_uri;
}

# ──────────────── smartpos.safebsc.finance (FLUTTER POS AI) ────────────────
server {
    server_name smartpos.safebsc.finance;

    root /var/www/web-pos-ai;
    index index.html;

    # ✅ CSP Header for Flutter Web (allows eval for WASM/Dart compilation)
    add_header Content-Security-Policy "default-src 'self' https: blob: data:; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: http://localhost:8071 smartpos.safebsc.finance;" always;

    # ✅ Static assets - ห้าม try_files เพื่อไม่ให้ fallback เป็น /index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ✅ Manifest & config files
    location ~* \.(json|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # ✅ /aipos - legacy path
    location = /aipos {
        return 301 /aipos/;
    }

    location /aipos/ {
        alias /var/www/telesale-ai-www-build/;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ✅ Odoo management interface
    location /manage {
        proxy_pass http://localhost:8071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ✅ API proxy to Odoo
    location /api/ {
        proxy_pass http://localhost:8071/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ✅ CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' '86400';
            return 204;
        }
    }

    # ✅ Flutter web routing - สำหรับ root path
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/smartpos.safebsc.finance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartpos.safebsc.finance/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS for smartpos
server {
    listen 80;
    server_name smartpos.safebsc.finance;
    return 301 https://$host$request_uri;
}

